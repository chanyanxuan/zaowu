# 造物工坊 nginx 配置(zaowugongfang.com / www)
# 80 端口:证书验证 + 全部跳转 HTTPS
server {
    listen 80;
    server_name zaowugongfang.com www.zaowugongfang.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name zaowugongfang.com www.zaowugongfang.com;

    ssl_certificate     /etc/letsencrypt/live/zaowugongfang.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/zaowugongfang.com/privkey.pem;

    client_max_body_size 25m;

    location / {
        proxy_pass http://app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /viewer/ {
        proxy_pass http://app:3245/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3D 预览器的静态资源与后端接口(根路径引用,转发给预览器服务)
    location /assets/ {
        proxy_pass http://app:3245;
        proxy_set_header Host $host;
    }

    location /__cad/ {
        proxy_pass http://app:3245;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;
    }
}
